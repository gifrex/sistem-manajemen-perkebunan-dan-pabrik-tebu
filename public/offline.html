<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#057A55">
    <title>Tidak Ada Koneksi — SB Tebu</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0fdf4;
            color: #1a1a1a;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-wrap svg {
            width: 40px;
            height: 40px;
            color: #057A55;
        }

        h1 {
            font-size: 1.375rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.9375rem;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-refresh {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #057A55;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            width: 100%;
            justify-content: center;
        }

        .btn-refresh:hover { background: #046644; }
        .btn-refresh:active { transform: scale(0.97); }

        .btn-refresh svg {
            width: 18px;
            height: 18px;
            transition: transform 0.4s;
        }

        .btn-refresh.loading svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            margin-top: 20px;
            font-size: 0.8125rem;
            color: #9ca3af;
            min-height: 20px;
        }

        .status.error { color: #ef4444; }
        .status.success { color: #057A55; }

        .divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 24px 0 20px;
        }

        .tip {
            font-size: 0.8125rem;
            color: #9ca3af;
        }

        .tip kbd {
            display: inline-block;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 0.75rem;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <!-- wifi-off icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <circle cx="12" cy="20" r="1" fill="currentColor"/>
            </svg>
        </div>

        <h1>Tidak Ada Koneksi</h1>
        <p>Periksa koneksi internet kamu, lalu tekan tombol di bawah untuk memuat ulang halaman.</p>

        <button class="btn-refresh" id="btnRefresh" onclick="hardRefresh()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Muat Ulang Halaman
        </button>

        <p class="status" id="status"></p>

        <hr class="divider">
        <p class="tip">
            Atau tekan <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> di keyboard
        </p>
    </div>

    <script>
        async function hardRefresh() {
            const btn = document.getElementById('btnRefresh');
            const status = document.getElementById('status');

            btn.classList.add('loading');
            btn.disabled = true;
            status.className = 'status';
            status.textContent = 'Membersihkan cache...';

            try {
                // 1. Clear semua SW cache
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }

                // 2. Unregister semua service worker
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.unregister()));
                }

                status.className = 'status success';
                status.textContent = 'Berhasil! Mengalihkan...';

                // 3. Reload — browser fetch fresh tanpa SW
                setTimeout(() => window.location.reload(), 300);

            } catch (err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                status.className = 'status error';
                status.textContent = 'Gagal membersihkan cache. Coba lagi.';
            }
        }

        // Auto-check koneksi — reload otomatis kalau sudah online
        window.addEventListener('online', () => {
            const status = document.getElementById('status');
            status.className = 'status success';
            status.textContent = 'Koneksi terdeteksi, memuat ulang...';
            setTimeout(() => hardRefresh(), 800);
        });
    </script>
</body>
</html>
