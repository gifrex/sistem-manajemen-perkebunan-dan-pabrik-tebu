name: Deploy TEST (Linux SSM)

on:
  workflow_dispatch: {}

jobs:
  # --- DEPLOY ONLY (ga build ulang, pake image latest yang udah ada) ---
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare and Send SSM command
        id: send
        run: |
          B64_COMPOSE=$(base64 -w 0 docker-compose.yml)
          B64_NGINX=$(base64 -w 0 docker/nginx/default.conf)

          CMD_ID=$(aws ssm send-command \
            --region "${{ secrets.AWS_REGION }}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.SSM_INSTANCE_ID_LINUX_TEST }}" \
            --parameters "commands=[
              \"mkdir -p /opt/apps/tebu/docker/nginx\",
              \"cd /opt/apps/tebu\",
              \"echo $B64_COMPOSE | base64 -d > docker-compose.yml\",
              \"echo $B64_NGINX | base64 -d > docker/nginx/default.conf\",
              \"sudo docker compose pull\",
              \"sudo docker compose up -d --force-recreate\",
              \"sudo docker exec tebu-app chown -R 82:82 storage bootstrap/cache\",
              \"sudo docker exec tebu-app chmod -R 775 storage bootstrap/cache\",
              \"sudo docker exec tebu-app php artisan vendor:publish --tag=log-viewer-assets --force\",
              \"sudo docker exec tebu-app php artisan optimize:clear\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command sent with ID: $CMD_ID"

      - name: Check Deployment Result
        run: |
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.SSM_INSTANCE_ID_LINUX_TEST }}"
          sleep 30
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json