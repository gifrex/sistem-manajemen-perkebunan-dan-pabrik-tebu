name: Auto Tag Version

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tag]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail
          git fetch --tags

          MSG=$(git log -1 --pretty=%B)

          # Aturan Main:
          # big_update:   → v2.0.0 (major) - perubahan besar
          # new_feature:  → v1.1.0 (minor) - fitur baru
          # fix: / update: → v1.0.1 (patch) - perbaikan / update kecil
          # selain itu    → skip, tidak bikin tag

          BUMP="none"
          if [[ "$MSG" == *"big_update:"* ]]; then BUMP="major";
          elif [[ "$MSG" == *"new_feature:"* ]]; then BUMP="minor";
          elif [[ "$MSG" == *"fix:"* ]] || [[ "$MSG" == *"update:"* ]]; then BUMP="patch";
          fi

          if [ "$BUMP" == "none" ]; then
            echo "No keyword found, skipping tag."
            exit 0
          fi

          LAST=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "${LAST:-}" ]; then
            NEW="v1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            case $BUMP in
              major) NEW="v$((MAJOR+1)).0.0" ;;
              minor) NEW="v$MAJOR.$((MINOR+1)).0" ;;
              patch) NEW="v$MAJOR.$MINOR.$((PATCH+1))" ;;
            esac
          fi

          echo "$BUMP → $NEW"
          git tag "$NEW"
          git push origin "$NEW"