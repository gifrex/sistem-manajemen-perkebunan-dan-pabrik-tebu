name: Deploy Production (Linux SSM)

# Memicu manual dari tab Actions di GitHub
on:
  workflow_dispatch: {} 

jobs:
  # --- TAHAP 1: BUILD IMAGE ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sungaibudiwebdev/tebu-app:latest
          # Mengambil dari GitHub Secrets, bukan ditulis langsung (hardcode)
          build-args: |
            VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}

  # --- TAHAP 2: DEPLOY KE AWS ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare and Send SSM command
        id: send
        run: |
          # 1. Bungkus kedua file jadi base64
          B64_COMPOSE=$(base64 -w 0 docker-compose.yml)
          B64_NGINX=$(base64 -w 0 docker/nginx/default.conf) # Tambahkan ini

          # 2. Kirim perintah ke AWS
          CMD_ID=$(aws ssm send-command \
            --region "${{ secrets.AWS_REGION }}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.SSM_INSTANCE_ID_LINUX }}" \
            --parameters "commands=[
              \"mkdir -p /opt/apps/tebu/docker/nginx\",
              \"cd /opt/apps/tebu\",
              \"echo $B64_COMPOSE | base64 -d > docker-compose.yml\",
              \"echo $B64_NGINX | base64 -d > docker/nginx/default.conf\",
              \"sudo docker compose pull\",
              \"sudo docker compose up -d --force-recreate\",
              \"sudo docker exec tebu-app chown -R 82:82 storage bootstrap/cache\",
              \"sudo docker exec tebu-app chmod -R 775 storage bootstrap/cache\",
              \"sudo docker exec tebu-app php artisan vendor:publish --tag=log-viewer-assets --force\",
              \"sudo docker exec tebu-app php artisan optimize:clear\",
              \"(crontab -l 2>/dev/null | grep -v 'schedule:run'; echo '* * * * * docker exec tebu-app php artisan schedule:run >> /dev/null 2>&1') | crontab -\"
            ]" \
            --query "Command.CommandId" \
            --output text)
          
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command sent with ID: $CMD_ID"

      - name: Check Deployment Result
        run: |
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.SSM_INSTANCE_ID_LINUX }}"
          
          # Tunggu sebentar agar server sempat memproses
          sleep 15
          
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json