apiVersion: apps/v1
kind: Deployment
metadata:
  name: tebu-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tebu
  template:
    metadata:
      labels:
        app: tebu
    spec:
      containers:
        - name: tebu
          image: tebu-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: DB_CONNECTION
              value: "mariadb"
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "tebu"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "xxx"
            - name: SESSION_DRIVER
              value: "redis"
            - name: REDIS_HOST
              value: "redis-service"

---

apiVersion: v1
kind: Service
metadata:
  name: tebu-service
spec:
  type: NodePort
  selector:
    app: tebu
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379