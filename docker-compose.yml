services:
  app:
    image: sungaibudiwebdev/tebu-app:latest
    container_name: tebu-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"        # <--- WAJIB: Tambahkan ini untuk HTTPS
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      # Tambahkan baris di bawah ini agar container bisa baca SSL
      - /etc/letsencrypt:/etc/letsencrypt:ro 
      # Tambahkan ini juga jika kamu ingin file config nginx lokal menimpa yang ada di image
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tebu-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: tebu-redis
    restart: unless-stopped
    networks:
      - tebu-network

networks:
  tebu-network:
    driver: bridge