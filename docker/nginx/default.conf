# --- Redirect HTTP (80) ke HTTPS (443) ---
server {
    listen 80;
    server_name sugarcane.sblampung.com;
    return 301 https://$host$request_uri;
}

# --- Konfigurasi Utama HTTPS (443) ---
server {
    listen 443 ssl;
    server_name sugarcane.sblampung.com;
    root /var/www/html/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/sugarcane.sblampung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugarcane.sblampung.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- TAMBAHKAN BLOK INI UNTUK WEBSOCKET ---
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://127.0.0.1:8080; 
    }
    # -----------------------------------------

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}