# --- Redirect All HTTP to HTTPS ---
server {
    listen 80;
    server_name sugarcane.sblampung.com dazytech.web.id;
    return 301 https://$host$request_uri;
}

# --- Konfigurasi HTTPS: Tebu (Laravel) ---
server {
    listen 443 ssl;
    server_name sugarcane.sblampung.com;
    root /var/www/html/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/sugarcane.sblampung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugarcane.sblampung.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080; 
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
    }
}

# --- Konfigurasi HTTPS: dazytech (Next.js) ---
server {
    listen 443 ssl;
    server_name dazytech.web.id;

    # Pastikan file sertifikat ini sudah ada di folder /etc/letsencrypt/live/
    ssl_certificate /etc/letsencrypt/live/dazytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dazytech.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://dazytech-app:3000; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}