# --- Redirect HTTP (80) ke HTTPS (443) ---
server {
    listen 80;
    server_name sugarcane.sblampung.com;
    return 301 https://$host$request_uri;
}

# --- Konfigurasi Utama HTTPS (443) ---
server {
    listen 443 ssl; # <--- Pakai SSL
    server_name sugarcane.sblampung.com;
    root /var/www/html/public;
    index index.php;

    # Jalur Sertifikat SSL (Yang tadi sudah di-mount di docker-compose)
    ssl_certificate /etc/letsencrypt/live/sugarcane.sblampung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugarcane.sblampung.com/privkey.pem;

    # Optimasi SSL (Opsional tapi bagus)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}