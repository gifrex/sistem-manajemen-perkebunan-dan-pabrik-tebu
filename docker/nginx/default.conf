server {
    listen 80;
    server_name sugarcane.sblampung.com;
    root /var/www/html/public;
    index index.php;

    # Batas upload file (50 MB)
    client_max_body_size 50M;

    # Optimasi Kompresi Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Konfigurasi PHP-FPM dengan Optimasi Buffer
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # --- OPTIMASI BUFFER (Mencegah Warning "Buffered to Temp File") ---
        # Mengaktifkan buffering
        fastcgi_buffering on;

        # Ukuran nampan untuk Header (Cookie, Session, dll)
        fastcgi_buffer_size 64k;

        # Total RAM cadangan per koneksi: 128 kantong x 16 KB = 2048 KB (2 MB)
        # Ini sudah sangat cukup untuk handle tabel besar atau file log tanpa tulis ke Disk.
        fastcgi_buffers 128 16k;

        # Mengatur berapa banyak data yang boleh dikirim ke user sekaligus
        fastcgi_busy_buffers_size 128k;

        # Jika respon Laravel > 2MB, sisa data ditulis ke disk dalam potongan 256k
        fastcgi_temp_file_write_size 256k;
        # ------------------------------------------------------------------
    }

    # Caching untuk file statis (Browser Cache)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}